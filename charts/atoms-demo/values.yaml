# 镜像由应用仓库的发布流程构建并推送至阿里云 ACR（registry.cn-hangzhou.aliyuncs.com/ss-vip），
# tag 由发布流程回写（gitops 仓库收到新 commit 后 Argo CD 自动同步）；
# 本地 helm template 验证时也改这里。
images:
  pullPolicy: IfNotPresent
  pullSecrets: []
  server:
    registry: registry.cn-hangzhou.aliyuncs.com
    repository: ss-vip/atoms-demo-server
    tag: "0.2.5"
  web:
    registry: registry.cn-hangzhou.aliyuncs.com
    repository: ss-vip/atoms-demo-web
    tag: "0.2.5"

server:
  replicas: 1
  port: 4173
  # LLM/COS 配置沿用已有 Secret；身份数据库与 SMTP 使用独立 Secret。
  secretsFrom: "atoms-demo-env"
  env:
    APP_BASE_URL: https://atoms.ss-vip.cn
    COOKIE_SECURE: "1"
    SMTP_HOST: smtp.163.com
    SMTP_PORT: "465"
    SMTP_SECURITY: tls
    REDIS_DB: "1"
  workspace:
    size: 2Gi
    storageClass: ""
    identityClaim: atoms-demo-identity-workspace

web:
  replicas: 1
  port: 80

migrate:
  # 迁移 Job 镜像：与共享 gitops（68-postgresql）init Job 同镜像，
  # 保证 ACR 命名空间 ss-vip 内可拉取且自带 psql。
  image: registry.cn-hangzhou.aliyuncs.com/ss-vip/postgresql:snap20260910

ingress:
  # 公网入口走基建仓库（gitops）的 istio 边缘网关：Gateway listener
  # https-atoms + HTTPRoute atoms-demo → 本 chart 的 web service。
  # 集群内 nginx ingress 不对外，保持关闭（避免重复签发证书）。
  enabled: false
  className: nginx
  host: atoms.ss-vip.cn
  # cert-manager ClusterIssuer 名称
  certIssuer: letsencrypt-prod
