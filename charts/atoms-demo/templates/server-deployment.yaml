apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atoms-demo.fullname" . }}-server
  labels:
    {{- include "atoms-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        # distroless nonroot (UID 65532) 需要写 workspace 卷
        fsGroup: 65532
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            runAsNonRoot: true
          image: {{ include "atoms-demo.serverImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: WORKSPACE_DIR
              value: /workspace
            # 全新实例的身份与项目数据使用独立 Postgres 数据库。
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: atoms-demo-identity
                  key: DATABASE_DSN
            # Redis Streams 同时承担实时事件扇出与任务队列（T4/T5/T6/T8）。
            # 与 DATABASE_DSN 同源，确保所有副本共享同一队列与广播通道。
            {{- range $key := list "REDIS_HOST" "REDIS_PORT" "REDIS_USERNAME" "REDIS_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: atoms-middleware
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- range $name, $value := .Values.server.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key := list "SMTP_FROM" "SMTP_USERNAME" "SMTP_PASSWORD" "PLATFORM_ADMIN_EMAILS" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: atoms-demo-identity
                  key: {{ $key }}
                  optional: true
            {{- end }}
            # LLM/COS 密钥沿用原有受控 Secret。
            {{- if .Values.server.secretsFrom }}
            {{- range $key := list "DEEPSEEK_API_KEY" "KIMI_API_KEY" "LOCAL_LLM_BASE_URL" "COS_BUCKET" "COS_ENDPOINT" "COS_SECRET_ID" "COS_SECRET_KEY" "COS_SESSION_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.server.secretsFrom | quote }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.server.workspace.identityClaim }}
