apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atoms-demo.fullname" . }}-server
  labels:
    {{- include "atoms-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        # distroless nonroot (UID 65532) 需要写 workspace 卷
        fsGroup: 65532
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            runAsNonRoot: true
          image: {{ include "atoms-demo.serverImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: WORKSPACE_DIR
              value: /workspace
            {{- range $name, $value := .Values.server.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            # 敏感配置（OIDC client secret、LLM API key 等）不走 git：
            # 集群里手工创建 Secret（kubectl create secret generic atoms-demo-env
            # --from-literal=OIDC_CLIENT_ID=... --from-literal=OIDC_CLIENT_SECRET=...
            # --from-literal=DEEPSEEK_API_KEY=...），此处按 key 同名引用。
            {{- if .Values.server.secretsFrom }}
            {{- range $key := list "OIDC_CLIENT_ID" "OIDC_CLIENT_SECRET" "DEEPSEEK_API_KEY" "KIMI_API_KEY" "LOCAL_LLM_BASE_URL" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.server.secretsFrom | quote }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "atoms-demo.fullname" . }}-workspace
